<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8F4" />
    <meta
      name="description"
      content="A little world for Aarya — a small, handmade corner of the internet made with love."
    />
    <title>A Little World for Aarya ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E"
    />

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "framer-motion": "https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1",
          "lucide-react": "https://esm.sh/lucide-react@0.454.0?deps=react@18.3.1"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

    <style>
      :root {
        --cream: #fff8f4;
        --pink: #ffe1e9;
        --rose: #c66f91;
        --lavender: #eae7ff;
        --peach: #ffe8d9;
        --sage: #eaf1e3;
        --plum: #50364e;
        --plum-soft: #6a4d67;
        --plum-line: rgba(80, 54, 78, 0.13);
        --card: #fffdfb;

        --font-display: 'Fraunces', 'Georgia', 'Times New Roman', serif;
        --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --font-hand: 'Caveat', 'Segoe Script', cursive;

        --radius-lg: 26px;
        --shadow-card: 0 26px 50px -34px rgba(80, 54, 78, 0.55),
          0 3px 12px -8px rgba(80, 54, 78, 0.22);
        --shadow-btn: 0 8px 18px -14px rgba(80, 54, 78, 0.65);
      }

      *, *::before, *::after { box-sizing: border-box; }

      html { min-height: 100%; background: var(--cream); -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        font-size: 16px;
        color: var(--plum);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: var(--cream);
        background-image:
          radial-gradient(1100px 620px at 8% -12%, #ffeaf1 0%, transparent 62%),
          radial-gradient(900px 520px at 102% -4%, #efebff 0%, transparent 58%),
          radial-gradient(900px 700px at 46% 112%, #fff0e2 0%, transparent 62%),
          radial-gradient(700px 500px at 92% 96%, #eef4e8 0%, transparent 60%);
      }

      #root { position: relative; z-index: 1; }

      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      :focus-visible {
        outline: 2.5px solid var(--rose);
        outline-offset: 3px;
        border-radius: 10px;
      }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        min-height: 46px; padding: 0.78rem 1.4rem;
        font-family: var(--font-body); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.01em;
        color: var(--plum); background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--plum-line); border-radius: 999px;
        box-shadow: var(--shadow-btn); cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.4), box-shadow 0.2s ease,
          background 0.2s ease, opacity 0.2s ease;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 14px 26px -16px rgba(80, 54, 78, 0.6);
        background: #ffffff;
      }
      .btn:active:not(:disabled) { transform: translateY(0) scale(0.965); }
      .btn:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
      .btn-primary {
        color: #4c2f47;
        background: linear-gradient(135deg, #ffdbe6 0%, #ffc9db 100%);
        border-color: rgba(198, 111, 145, 0.38);
      }
      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #ffd2e0 0%, #ffc0d5 100%);
      }

      .icon-btn {
        display: grid; place-items: center; width: 44px; height: 44px;
        color: var(--plum); background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--plum-line); border-radius: 50%; cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.4), background 0.2s ease,
          box-shadow 0.2s ease;
      }
      .icon-btn:hover {
        transform: translateY(-2px); background: #ffffff;
        box-shadow: 0 10px 20px -16px rgba(80, 54, 78, 0.7);
      }
      .icon-btn:active { transform: scale(0.94); }
      .icon-btn[aria-pressed='true'] {
        background: var(--lavender); border-color: rgba(122, 107, 181, 0.35);
      }

      /* INTRO */
      .intro {
        position: relative; display: flex; align-items: center; justify-content: center;
        min-height: 100vh; min-height: 100dvh; padding: clamp(1.6rem, 5vw, 3rem) 1.15rem;
        text-align: center;
      }
      .intro-inner { width: min(620px, 100%); display: flex; flex-direction: column; align-items: center; }
      .eyebrow {
        margin: 0 0 0.9rem; font-family: var(--font-hand); font-size: 1.28rem;
        letter-spacing: 0.02em; color: var(--rose);
      }
      .intro-title {
        margin: 0; font-family: var(--font-display); font-weight: 600;
        font-size: clamp(1.9rem, 6.2vw, 3.05rem); line-height: 1.16; letter-spacing: -0.015em;
        color: var(--plum);
      }
      .intro-heart {
        display: inline-block; color: var(--rose);
        animation: gentlePulse 3.4s ease-in-out infinite;
      }
      .intro-sub {
        margin: 1.15rem 0 0; font-size: clamp(1rem, 2.8vw, 1.1rem);
        line-height: 1.7; color: var(--plum-soft); max-width: 34ch;
      }
      .intro-sub-small {
        margin-top: 0.35rem; font-size: clamp(0.92rem, 2.6vw, 1rem); color: #7c5f78;
      }
      .intro-btn { margin-top: 0.6rem; }

      .envelope {
        position: relative; display: block; width: min(300px, 76vw); aspect-ratio: 3 / 2;
        margin: clamp(1.6rem, 5vw, 2.4rem) auto 1.5rem; padding: 0; background: none; border: 0;
        cursor: pointer; perspective: 900px;
        filter: drop-shadow(0 22px 30px rgba(80, 54, 78, 0.16));
        transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.4);
      }
      .envelope:hover:not(.is-open) { transform: translateY(-9px) rotate(-1.6deg); }
      .envelope:focus-visible { outline: 3px solid var(--rose); outline-offset: 12px; border-radius: 16px; }
      .envelope.is-open { cursor: default; }
      .env-back, .env-letter, .env-pocket, .env-flap { position: absolute; }
      .env-back {
        inset: 0; z-index: 1; border-radius: 12px;
        background: linear-gradient(160deg, #ffedf3 0%, #ffd9e5 100%);
      }
      .env-letter {
        left: 8%; right: 8%; bottom: 10%; z-index: 3;
        display: flex; flex-direction: column; gap: 8px; height: 62%;
        padding: 14px 16px; text-align: left; background: var(--card);
        border-radius: 8px 8px 4px 4px;
        box-shadow: 0 -5px 16px -10px rgba(80, 54, 78, 0.45);
        transform: translateY(0); transition: transform 0.9s cubic-bezier(0.34, 1.25, 0.4, 1);
      }
      .envelope.is-open .env-letter { transform: translateY(-74%); transition-delay: 0.32s; }
      .env-line { display: block; height: 5px; border-radius: 999px; background: rgba(198, 111, 145, 0.22); }
      .env-line.short { width: 72%; }
      .env-line.shorter { width: 46%; }
      .env-sign { margin-top: auto; font-family: var(--font-hand); font-size: 1.05rem; color: var(--rose); }
      .env-pocket {
        inset: 0; z-index: 4; border-radius: 12px;
        background: linear-gradient(200deg, #ffd6e4 0%, #ffc4d8 100%);
        clip-path: polygon(0 0, 50% 42%, 100% 0, 100% 100%, 0 100%);
      }
      .env-flap {
        top: 0; left: 0; right: 0; z-index: 5; height: 58%;
        background: linear-gradient(180deg, #ffdde8 0%, #ffc0d4 100%);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        border-radius: 12px 12px 0 0; transform-origin: top center;
        transition: transform 0.8s cubic-bezier(0.55, 0.06, 0.3, 1);
      }
      .envelope.is-open .env-flap { z-index: 2; transform: rotateX(-180deg); }
      .env-seal {
        position: absolute; top: 52%; left: 50%; z-index: 6;
        display: grid; place-items: center; width: 46px; height: 46px;
        font-size: 1.2rem; color: #fff3f7;
        background: radial-gradient(circle at 35% 28%, #e58ba9 0%, #c66f91 78%);
        border-radius: 50%; box-shadow: 0 6px 12px -6px rgba(80, 54, 78, 0.65);
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease, transform 0.35s ease;
      }
      .envelope.is-open .env-seal { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }

      /* STORY */
      .story {
        display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
        width: min(900px, 100%); margin: 0 auto;
        padding: clamp(0.9rem, 3vw, 1.6rem) clamp(0.9rem, 4vw, 2rem) clamp(2.4rem, 6vw, 3.4rem);
      }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        width: min(720px, 100%); margin: 0 auto;
      }
      .topbar-note {
        margin: 0; font-family: var(--font-hand); font-size: 1.35rem;
        color: var(--rose); opacity: 0.85;
      }

      .progress {
        display: flex; align-items: center; gap: 0.85rem;
        width: min(720px, 100%); margin: 1rem auto 0;
      }
      .progress-count {
        flex: 0 0 auto; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em;
        color: var(--plum-soft); font-variant-numeric: tabular-nums;
      }
      .progress-track {
        position: relative; flex: 1 1 auto; height: 4px; overflow: hidden;
        background: rgba(80, 54, 78, 0.1); border-radius: 999px;
      }
      .progress-fill {
        position: absolute; inset: 0 auto 0 0; display: block; height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f3b9cd 0%, #c66f91 55%, #b18fd6 100%);
      }

      .stage {
        position: relative; display: flex; justify-content: center;
        width: min(720px, 100%); min-height: clamp(340px, 54vh, 520px);
        margin: 1.35rem auto 0;
      }

      .story-card {
        position: relative; isolation: isolate; width: 100%;
        padding: clamp(1.5rem, 4.4vw, 2.6rem);
        background: linear-gradient(172deg, #fffdfb 0%, #fff7f3 100%);
        border: 1px solid var(--plum-line); border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card); color: var(--plum);
      }
      .story-card::before {
        content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
        background:
          radial-gradient(115% 85% at 102% -4%, var(--accent-bg) 0%, transparent 58%),
          radial-gradient(95% 70% at -6% 104%, var(--accent-bg) 0%, transparent 62%);
        opacity: 0.6; pointer-events: none;
      }

      .accent-pink     { --accent-bg: #ffe1e9; --accent-ink: #c66f91; }
      .accent-lavender { --accent-bg: #eae7ff; --accent-ink: #8072bb; }
      .accent-peach    { --accent-bg: #ffe8d9; --accent-ink: #cc8a5c; }
      .accent-sage     { --accent-bg: #eaf1e3; --accent-ink: #7d9470; }

      .washi {
        position: absolute; top: -10px; left: clamp(1.2rem, 6vw, 2.6rem);
        width: 96px; height: 24px;
        background:
          repeating-linear-gradient(135deg,
            rgba(255, 255, 255, 0.65) 0 6px,
            rgba(255, 255, 255, 0.25) 6px 12px),
          var(--accent-bg);
        border-radius: 3px; opacity: 0.9; transform: rotate(-3deg);
        box-shadow: 0 2px 6px -4px rgba(80, 54, 78, 0.5);
      }

      .card-doodle {
        width: clamp(66px, 16vw, 84px); height: clamp(66px, 16vw, 84px);
        margin-bottom: 0.4rem; color: var(--accent-ink);
        cursor: default; transform-origin: 50% 90%;
        transition: transform 0.3s ease;
      }
      .card-doodle:hover { animation: doodleWiggle 0.75s ease-in-out; }
      .card-doodle .doodle { display: block; width: 100%; height: 100%; overflow: visible; }

      .card-title {
        margin: 0.15rem 0 0; font-family: var(--font-display);
        font-size: clamp(1.45rem, 4.4vw, 2.05rem); font-weight: 600;
        line-height: 1.25; letter-spacing: -0.012em; color: var(--plum);
        text-wrap: balance;
      }
      .title-underline {
        display: block; width: min(160px, 42%); height: 12px;
        margin: 0.3rem 0 1.15rem; color: var(--accent-ink); overflow: visible;
      }
      .card-body p {
        margin: 0 0 0.85rem; font-size: clamp(0.98rem, 2.7vw, 1.06rem);
        line-height: 1.78; color: #46303f; text-wrap: pretty;
      }
      .card-body p:last-child { margin-bottom: 0; }
      .card-signature {
        margin-top: 1.1rem !important; font-family: var(--font-hand);
        font-size: 1.4rem !important; line-height: 1.4 !important; color: var(--rose);
      }

      .surprise { position: relative; margin-top: 1.35rem; }
      .surprise-trigger {
        display: inline-flex; align-items: center; gap: 0.45rem;
        padding: 0.5rem 0.95rem; font-family: var(--font-body);
        font-size: 0.82rem; font-weight: 800; letter-spacing: 0.02em;
        color: var(--accent-ink); background: rgba(255, 255, 255, 0.7);
        border: 1px dashed currentColor; border-radius: 999px; cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.4), background 0.2s ease;
      }
      .surprise-trigger:hover { transform: translateY(-2px) rotate(-1deg); background: #ffffff; }
      .surprise-trigger:active { transform: scale(0.96); }
      .surprise-trigger svg { transition: transform 0.35s ease; }
      .surprise-trigger[aria-expanded='true'] svg { transform: rotate(72deg) scale(1.1); }
      .surprise-pop {
        margin-top: 0.7rem; padding: 0.9rem 1.1rem;
        font-family: var(--font-hand); font-size: 1.22rem; line-height: 1.5;
        color: #5c3f58; background: #fffdf9;
        border: 1px solid var(--plum-line); border-left: 3px solid var(--accent-ink);
        border-radius: 4px 16px 16px 16px;
        box-shadow: 0 12px 24px -22px rgba(80, 54, 78, 0.8);
        transform-origin: top left;
      }

      .final-actions {
        display: flex; flex-wrap: wrap; gap: 0.7rem;
        margin-top: 1.6rem; padding-top: 1.35rem;
        border-top: 1px dashed var(--plum-line);
      }

      .card-nav {
        display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
        width: min(720px, 100%); margin: 1.2rem auto 0;
      }
      .nav-spacer { flex: 1 1 auto; }

      .chapter-petals {
        position: absolute; inset: 0; z-index: 0; overflow: hidden;
        pointer-events: none; border-radius: var(--radius-lg);
      }
      .chapter-petal {
        position: absolute; top: -30px; display: block;
        background: radial-gradient(circle at 30% 25%, #ffd6e3 0%, #f2b3c9 70%);
        border-radius: 60% 60% 55% 55% / 75% 75% 45% 45%;
        opacity: 0.55;
      }

      .floating-decorations {
        position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      }
      .float-item {
        position: absolute; display: block; opacity: 0.24; color: var(--rose);
        animation-name: driftFloat; animation-timing-function: ease-in-out;
        animation-iteration-count: infinite; will-change: transform;
      }
      .float-item.float-sparkle { color: #b39ddb; opacity: 0.22; }
      .float-item svg { display: block; width: 100%; height: 100%; }

      .cursor-sparkles { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
      .cursor-sparkle {
        position: absolute; display: block;
        background: radial-gradient(circle, #ffd3e2 0%, rgba(198, 111, 145, 0) 72%);
        border-radius: 50%;
      }

      .overlay {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        padding: 1.2rem; background: rgba(80, 54, 78, 0.24);
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      }

      .keepsake {
        position: relative; width: min(430px, 100%);
        padding: 2.3rem 1.7rem 1.9rem; text-align: center;
        background: linear-gradient(172deg, #fffdfb 0%, #fff3ee 100%);
        border: 1px solid var(--plum-line); border-radius: 22px;
        box-shadow: 0 30px 60px -34px rgba(80, 54, 78, 0.6);
      }
      .keepsake-tape {
        position: absolute; top: -11px; left: 50%; width: 84px; height: 22px;
        background:
          repeating-linear-gradient(135deg,
            rgba(255, 255, 255, 0.6) 0 6px,
            rgba(255, 255, 255, 0.2) 6px 12px),
          var(--pink);
        border-radius: 3px; transform: translateX(-50%) rotate(-2deg); opacity: 0.95;
      }
      .keepsake-heart { color: var(--rose); margin-bottom: 0.4rem; }
      .keepsake-title {
        margin: 0 0 0.75rem; font-family: var(--font-display);
        font-size: 1.32rem; font-weight: 600; color: var(--plum);
      }
      .keepsake-text {
        margin: 0 0 0.9rem; font-size: 1rem; line-height: 1.75; color: #46303f;
      }
      .keepsake-sign {
        margin: 0 0 1.35rem; font-family: var(--font-hand);
        font-size: 1.25rem; color: var(--rose);
      }

      .dialog {
        width: min(400px, 100%); padding: 1.7rem 1.5rem 1.5rem;
        text-align: center; background: var(--card);
        border: 1px solid var(--plum-line); border-radius: 20px;
        box-shadow: 0 30px 60px -34px rgba(80, 54, 78, 0.6);
      }
      .dialog h2 {
        margin: 0 0 0.55rem; font-family: var(--font-display);
        font-size: 1.22rem; font-weight: 600; color: var(--plum);
      }
      .dialog-text {
        margin: 0 0 1.3rem; font-size: 0.95rem; line-height: 1.65; color: var(--plum-soft);
      }
      .dialog-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }

      @keyframes driftFloat {
        0%   { transform: translate3d(0, 0, 0) rotate(var(--tilt, 0deg)); }
        50%  { transform: translate3d(12px, -30px, 0) rotate(calc(var(--tilt, 0deg) + 10deg)); }
        100% { transform: translate3d(0, 0, 0) rotate(var(--tilt, 0deg)); }
      }
      @keyframes gentlePulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50%      { transform: scale(1.12); opacity: 1; }
      }
      @keyframes doodleWiggle {
        0%, 100% { transform: rotate(0deg); }
        25%      { transform: rotate(-6deg) translateY(-2px); }
        55%      { transform: rotate(5deg) translateY(-3px); }
        80%      { transform: rotate(-2deg); }
      }

      @media (max-width: 560px) {
        .story-card { border-radius: 22px; }
        .washi { width: 74px; height: 20px; }
        .card-nav .btn { flex: 1 1 auto; padding: 0.78rem 1rem; font-size: 0.9rem; }
        .nav-spacer { display: none; }
        .final-actions .btn { width: 100%; }
        .topbar-note { font-size: 1.15rem; }
      }
      @media (max-width: 380px) {
        .progress { gap: 0.6rem; }
        .progress-count { font-size: 0.72rem; }
      }

      .reduce-motion *,
      .reduce-motion *::before,
      .reduce-motion *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
      import React, {
        useCallback,
        useEffect,
        useId,
        useMemo,
        useRef,
        useState,
      } from 'react';
      import { createRoot } from 'react-dom/client';
      import { AnimatePresence, motion } from 'framer-motion';
      import { Gift, Heart, Home, RotateCcw, Sparkles, Star } from 'lucide-react';

      /* ===========================================================
         DATA — all 16 pages
         =========================================================== */
      const pages = [
        {
          id: 1,
          title: 'Hey, Aarya ♡',
          accent: 'pink',
          doodle: 'envelope',
          paragraphs: [
            'Heyyy, Aarya! ♡',
            'I made this little corner of the world just for you. I know you’ve been feeling a little low lately, so I wanted to leave you a few words you can come back to whenever you need them.',
            'No pressure to smile. Just a little reminder that someone is rooting for you.',
          ],
        },
        {
          id: 2,
          title: 'It’s okay not to be okay.',
          accent: 'lavender',
          doodle: 'cloud',
          paragraphs: [
            'You don’t have to feel happy every day. Some days are quiet, confusing, tiring, or just a little harder than usual.',
            'You don’t need to explain every feeling perfectly. It’s okay to just feel what you feel. ♡',
          ],
        },
        {
          id: 3,
          title: 'You’re more than today.',
          accent: 'peach',
          doodle: 'flower',
          paragraphs: [
            'One difficult day doesn’t define you, Aarya.',
            'You’re still the same kind, lovely, interesting person, even when you don’t feel like your usual self. Your worth doesn’t disappear just because your smile takes a little break.',
          ],
        },

        const [open, setOpen] = useState(false);
        const wrapRef = useRef(null);
        const noteId = useId();

        useEffect(() => {
          if (!open) return undefined;
          const onPointerDown = (event) => {
            if (wrapRef.current && !wrapRef.current.contains(event.target)) setOpen(false);
          };
          const onKeyDown = (event) => {
            if (event.key === 'Escape') setOpen(false);
          };
          document.addEventListener('mousedown', onPointerDown);
          document.addEventListener('keydown', onKeyDown);
          return () => {
            document.removeEventListener('mousedown', onPointerDown);
            document.removeEventListener('keydown', onKeyDown);
          };
        }, [open]);

        return (
          <div className="surprise" ref={wrapRef}>
            <button
              type="button"
              className="surprise-trigger"
              aria-expanded={open}
              aria-controls={noteId}
              onClick={() => setOpen((v) => !v)}

              <Star size={15} aria-hidden="true" />
              <span>tap for a tiny surprise</span>

                  id={noteId}
                  role="note"
                  className="surprise-pop"
                  initial={{ opacity: 0, y: 8, scale: 0.96 }}
                  animate={{ opacity: 1, y: 0, scale: 1 }}
                  exit={{ opacity: 0, y: 6, scale: 0.97 }}
                  transition={{ duration: reduce ? 0 : 0.28, ease: 'easeOut' }}
                >
                  {note}
                </motion.div>
              )}
            </AnimatePresence>
          </div>
        );

                  Read the little notes again ↺
                </button>
                <button type="button" className="btn btn-primary" onClick={onKeep}>
                  Keep this little reminder ♡
                </button>
              </div>
            )}
          </motion.article>
        );
      }

      /* ===========================================================
         Intro envelope
         =========================================================== */
      function IntroEnvelope({ onOpen, reduce }) {
        const [opening, setOpening] = useState(false);

        const handleOpen = useCallback(() => {
          if (opening) return;
          setOpening(true);
          window.setTimeout(onOpen, reduce ? 120 : 1000);
        }, [opening, onOpen, reduce]);

        return (
          <motion.section
            className="intro"
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0, y: reduce ? 0 : -18 }}
            transition={{ duration: reduce ? 0 : 0.35, ease: 'easeOut' }}
          >
            <div className="intro-inner">
              <motion.p
                className="eyebrow"
                initial={{ opacity: 0, y: 10 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: reduce ? 0 : 0.55, delay: reduce ? 0 : 0.08 }}
              >
                a little something, just because
              </motion.p>

              <motion.h1
                className="intro-title"
                initial={{ opacity: 0, y: 14 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: reduce ? 0 : 0.65, delay: reduce ? 0 : 0.15 }}
              >
                A tiny little world,
                <br />
                made just for you <span className="intro-heart">♡</span>
              </motion.h1>

              <motion.p
                className="intro-sub"
                initial={{ opacity: 0, y: 12 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: reduce ? 0 : 0.65, delay: reduce ? 0 : 0.25 }}
              >
                Hey, Aarya. I made something for you.
              </motion.p>

              <motion.p
                className="intro-sub intro-sub-small"
                initial={{ opacity: 0, y: 12 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: reduce ? 0 : 0.65, delay: reduce ? 0 : 0.32 }}
              >
                It’s nothing huge, just a little reminder that you matter.
              </motion.p>

              <motion.button
                type="button"
                className={`envelope${opening ? ' is-open' : ''}`}
                onClick={handleOpen}
                aria-label="Open your little letter"
                initial={{ opacity: 0, y: 22, scale: 0.96 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                transition={
                  reduce
                    ? { duration: 0 }
                    : { type: 'spring', stiffness: 160, damping: 18, delay: 0.38 }
                }
              >
                <span className="env-back" aria-hidden="true" />
                <span className="env-letter" aria-hidden="true">
                  <span className="env-line" />
                  <span className="env-line short" />
                  <span className="env-line" />
                  <span className="env-line shorter" />
                  <span className="env-sign">for Aarya ♡</span>
                </span>
                <span className="env-pocket" aria-hidden="true" />
                <span className="env-flap" aria-hidden="true" />
                <span className="env-seal" aria-hidden="true">♡</span>
              </motion.button>

              <motion.button
                type="button"
                className="btn btn-primary intro-btn"
                onClick={handleOpen}
                disabled={opening}
                initial={{ opacity: 0, y: 12 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ duration: reduce ? 0 : 0.55, delay: reduce ? 0 : 0.55 }}
              >
                {opening ? 'Opening your letter…' : 'Open your little letter ♡'}
              </motion.button>
            </div>
          </motion.section>
        );
      }

      /* ===========================================================
         Final keepsake
         =========================================================== */
      function FinalKeepsake({ onClose, reduce }) {
        const closeRef = useRef(null);

        useEffect(() => {
          closeRef.current?.focus();
          const onKeyDown = (event) => {
            if (event.key === 'Escape') onClose();
          };
          document.addEventListener('keydown', onKeyDown);
          return () => document.removeEventListener('keydown', onKeyDown);
        }, [onClose]);

        return (
          <motion.div
            className="overlay"
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            transition={{ duration: reduce ? 0 : 0.25 }}
            onClick={onClose}
          >
            <motion.div
              className="keepsake"
              role="dialog"
              aria-modal="true"
              aria-labelledby="keepsake-title"
              onClick={(event) => event.stopPropagation()}
              initial={{ opacity: 0, y: 26, scale: 0.96, rotate: -1 }}
              animate={{ opacity: 1, y: 0, scale: 1, rotate: 0 }}
              exit={{ opacity: 0, y: 14, scale: 0.97 }}
              transition={
                reduce ? { duration: 0 } : { type: 'spring', stiffness: 220, damping: 24 }
              }
            >
              <span className="keepsake-tape" aria-hidden="true" />
              <Heart className="keepsake-heart" size={24} aria-hidden="true" />
              <h2 id="keepsake-title" className="keepsake-title">
                A little reminder to keep
              </h2>
              <p className="keepsake-text">
                On days when everything feels a little too much, take a breath and remember:
                you don’t have to do it all today. ♡
              </p>
              <p className="keepsake-sign">— for Aarya, always</p>
              <button
                type="button"
                className="btn btn-primary"
                onClick={onClose}
                ref={closeRef}
              >
                Back to the letter
              </button>
            </motion.div>
          </motion.div>
        );
      }

      /* ===========================================================
         Restart confirm
         =========================================================== */
      function RestartConfirm({ onCancel, onConfirm, reduce }) {
        const cancelRef = useRef(null);

        useEffect(() => {
          cancelRef.current?.focus();
          const onKeyDown = (event) => {
            if (event.key === 'Escape') onCancel();
          };
          document.addEventListener('keydown', onKeyDown);
          return () => document.removeEventListener('keydown', onKeyDown);
        }, [onCancel]);

        return (
          <motion.div
            className="overlay"
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            transition={{ duration: reduce ? 0 : 0.22 }}
            onClick={onCancel}
          >
            <motion.div
              className="dialog"
              role="dialog"
              aria-modal="true"
              aria-labelledby="restart-title"
              onClick={(event) => event.stopPropagation()}
              initial={{ opacity: 0, y: 18, scale: 0.97 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              exit={{ opacity: 0, y: 12, scale: 0.98 }}
              transition={
                reduce ? { duration: 0 } : { type: 'spring', stiffness: 260, damping: 24 }
              }
            >
              <h2 id="restart-title">Start over from the beginning?</h2>
              <p className="dialog-text">
                The little notes will go back to page one. Nothing is lost. ♡
              </p>
              <div className="dialog-actions">
                <button type="button" className="btn" onClick={onCancel} ref={cancelRef}>
                  Not yet
                </button>
                <button type="button" className="btn btn-primary" onClick={onConfirm}>
                  Yes, start over
                </button>
              </div>
            </motion.div>
          </motion.div>
        );
      }

      /* ===========================================================
         Cursor sparkle
         =========================================================== */
      function CursorSparkle({ enabled }) {
        const [sparkles, setSparkles] = useState([]);
        const lastRef = useRef(0);

        useEffect(() => {
          if (!enabled) {
            setSparkles([]);
            return undefined;
          }
          const isFinePointer =
            window.matchMedia && window.matchMedia('(pointer: fine)').matches;
          if (!isFinePointer) return undefined;

          const onMove = (event) => {
            const now = performance.now();
            if (now - lastRef.current < 80) return;
            lastRef.current = now;

            const id = `${now}-${Math.random().toString(36).slice(2, 7)}`;
            const size = 6 + Math.random() * 7;

            setSparkles((current) => [
              ...current.slice(-7),
              { id, x: event.clientX, y: event.clientY, size },
            ]);

            window.setTimeout(() => {
              setSparkles((current) => current.filter((s) => s.id !== id));
            }, 780);
          };

          window.addEventListener('mousemove', onMove, { passive: true });
          return () => window.removeEventListener('mousemove', onMove);
        }, [enabled]);

        if (!enabled) return null;

        return (
          <div className="cursor-sparkles" aria-hidden="true">
            {sparkles.map((sparkle) => (
              <motion.span
                key={sparkle.id}
                className="cursor-sparkle"
                style={{
                  left: sparkle.x,
                  top: sparkle.y,
                  width: sparkle.size,
                  height: sparkle.size,
                  marginLeft: -sparkle.size / 2,
                  marginTop: -sparkle.size / 2,
                }}
                initial={{ opacity: 0.65, scale: 0.4 }}
                animate={{ opacity: 0, scale: 1.15, y: -16 }}
                transition={{ duration: 0.78, ease: 'easeOut' }}
              />
            ))}
          </div>
        );
      }

      /* ===========================================================
         App
         =========================================================== */
      function App() {
        const [screen, setScreen] = useState('intro');
        const [index, setIndex] = useState(0);
        const [direction, setDirection] = useState(1);
        const [keepsakeOpen, setKeepsakeOpen] = useState(false);
        const [confirmOpen, setConfirmOpen] = useState(false);

        const [reduceEffects, setReduceEffects] = useState(() => {
          if (typeof window === 'undefined' || !window.matchMedia) return false;
          return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        });

        const navLock = useRef(false);

        useEffect(() => {
          document.documentElement.classList.toggle('reduce-motion', reduceEffects);
        }, [reduceEffects]);

        const navigate = useCallback(
          (nextIndex, dir) => {
            if (navLock.current) return;
            if (nextIndex < 0 || nextIndex >= TOTAL_PAGES) return;
            navLock.current = true;
            setDirection(dir);
            setIndex(nextIndex);
            window.setTimeout(
              () => {
                navLock.current = false;
              },
              reduceEffects ? 250 : 720
            );
          },
          [reduceEffects]
        );

        const goNext = useCallback(() => navigate(index + 1, 1), [index, navigate]);
        const goBack = useCallback(() => navigate(index - 1, -1), [index, navigate]);

        const handleRestart = useCallback(() => {
          setConfirmOpen(false);
          setKeepsakeOpen(false);
          navLock.current = false;
          setDirection(-1);
          setIndex(0);
        }, []);

        const handleReadAgain = useCallback(() => {
          navLock.current = false;
          setDirection(-1);
          setIndex(0);
        }, []);

        useEffect(() => {
          if (screen !== 'story') return undefined;
          const onKeyDown = (event) => {
            if (confirmOpen || keepsakeOpen) return;
            if (event.key === 'ArrowRight') {
              event.preventDefault();
              goNext();
            } else if (event.key === 'ArrowLeft') {
              event.preventDefault();
              goBack();
            }
          };
          window.addEventListener('keydown', onKeyDown);
          return () => window.removeEventListener('keydown', onKeyDown);
        }, [screen, goNext, goBack, confirmOpen, keepsakeOpen]);

        const page = pages[index];

        return (
          <>
            <FloatingDecorations reduce={reduceEffects} />
            <CursorSparkle enabled={!reduceEffects} />

            <AnimatePresence mode="wait" initial={false}>
              {screen === 'intro' && (
                <IntroEnvelope
                  key="intro"
                  reduce={reduceEffects}
                  onOpen={() => {
                    setDirection(1);
                    setIndex(0);
                    setScreen('story');
                  }}
                />
              )}

              {screen === 'story' && (
                <motion.main
                  key="story"
                  className="story"
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  transition={{ duration: reduceEffects ? 0 : 0.4, ease: 'easeOut' }}
                >
                  <div className="topbar">
                    <button
                      type="button"
                      className="icon-btn"
                      onClick={() => setConfirmOpen(true)}
                      aria-label="Start over from the beginning"
                      title="Start over"
                    >
                      <Home size={18} aria-hidden="true" />
                    </button>

                    <p className="topbar-note" aria-hidden="true">for Aarya ♡</p>

                    <button
                      type="button"
                      className="icon-btn"
                      onClick={() => setReduceEffects((v) => !v)}
                      aria-pressed={reduceEffects}
                      aria-label={
                        reduceEffects
                          ? 'Turn gentle animations back on'
                          : 'Reduce animations'
                      }
                      title={reduceEffects ? 'Motion: off' : 'Motion: on'}
                    >
                      <Sparkles size={18} aria-hidden="true" />
                    </button>
                  </div>

                  <ProgressIndicator
                    current={index + 1}
                    total={TOTAL_PAGES}
                    reduce={reduceEffects}
                  />

                  <div className="stage">
                    {!reduceEffects && <ChapterPetals key={`petals-${index}`} />}

                    <AnimatePresence mode="wait" custom={direction} initial={false}>
                      <StoryCard
                        key={page.id}
                        page={page}
                        index={index}
                        total={TOTAL_PAGES}
                        direction={direction}
                        reduce={reduceEffects}
                        onRestart={handleReadAgain}
                        onKeep={() => setKeepsakeOpen(true)}
                      />
                    </AnimatePresence>
                  </div>

                  <nav className="card-nav" aria-label="Story navigation">
                    <button
                      type="button"
                      className="btn"
                      onClick={goBack}
                      disabled={index === 0}
                    >
                      ← Back
                    </button>

                    {index < TOTAL_PAGES - 1 ? (
                      <button type="button" className="btn btn-primary" onClick={goNext}>
                        Next little note →
                      </button>
                    ) : (
                      <span className="nav-spacer" aria-hidden="true" />
                    )}
                  </nav>

                  <p className="sr-only" aria-live="polite">
                    Page {index + 1} of {TOTAL_PAGES}
                  </p>
                </motion.main>
              )}
            </AnimatePresence>

            <AnimatePresence>
              {keepsakeOpen && (
                <FinalKeepsake
                  key="keepsake"
                  reduce={reduceEffects}
                  onClose={() => setKeepsakeOpen(false)}
                />
              )}
              {confirmOpen && (
                <RestartConfirm
                  key="confirm"
                  reduce={reduceEffects}
                  onCancel={() => setConfirmOpen(false)}
                  onConfirm={handleRestart}
                />
              )}
            </AnimatePresence>
          </>
        );
      }

      createRoot(document.getElementById('root')).render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
